<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Pontinho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Setup Screen ── */
    #setup {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      padding: 40px;
      width: 420px;
    }

    #setup h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 8px;
      color: #222;
    }

    #setup .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
      font-size: 0.9rem;
    }

    .section-title {
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 10px;
    }

    .grid-config {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .grid-config label {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
      color: #444;
    }

    .grid-config input {
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      transition: border-color 0.2s;
    }

    .grid-config input:focus {
      outline: none;
      border-color: #4a90e2;
    }

    .players-section { margin-bottom: 28px; }

    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .player-color {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(0,0,0,0.15);
    }

    .player-row input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    .player-row input[type="text"]:focus {
      outline: none;
      border-color: #4a90e2;
    }

    .btn-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 1.2rem;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .btn-remove:hover { color: #e74c3c; background: #fdf0ef; }

    #btn-add-player {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 2px dashed #ccc;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      color: #888;
      font-size: 0.9rem;
      width: 100%;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s;
    }

    #btn-add-player:hover { border-color: #4a90e2; color: #4a90e2; }

    #btn-start {
      width: 100%;
      padding: 14px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #btn-start:hover { background: #357abd; }
    #btn-start:active { transform: scale(0.98); }

    /* ── Game Screen ── */
    #game {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
      width: 100%;
    }

    #game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 900px;
      margin-bottom: 20px;
      gap: 16px;
    }

    #game-header h1 {
      font-size: 1.4rem;
      color: #222;
    }

    #scoreboard {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .score-card {
      display: flex;
      align-items: center;
      gap: 8px;
      background: white;
      border-radius: 10px;
      padding: 8px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 2px solid transparent;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .score-card.active {
      border-color: var(--player-color);
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    .score-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--player-color);
    }

    .score-name { font-weight: 600; font-size: 0.9rem; color: #333; }
    .score-pts { font-size: 0.9rem; color: #666; margin-left: 2px; }

    #turn-info {
      text-align: center;
      font-size: 1rem;
      color: #555;
      margin-bottom: 16px;
      min-height: 24px;
    }

    #turn-info span {
      font-weight: 700;
    }

    /* ── Canvas ── */
    #board-container {
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 24px;
      display: inline-block;
    }

    canvas {
      display: block;
      cursor: default;
    }

    #btn-restart {
      margin-top: 20px;
      padding: 10px 28px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      color: #555;
      transition: border-color 0.2s, color 0.2s;
    }

    #btn-restart:hover { border-color: #4a90e2; color: #4a90e2; }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    #modal-overlay.show { display: flex; }

    #modal {
      background: white;
      border-radius: 16px;
      padding: 40px 48px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.2);
      min-width: 300px;
    }

    #modal h2 { font-size: 1.8rem; margin-bottom: 8px; }
    #modal .result { font-size: 1.1rem; color: #555; margin-bottom: 28px; }
    #modal .result strong { color: #222; }

    #modal-scores {
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-score-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f9f9f9;
    }

    .modal-score-row.winner { background: #fff8e1; }

    .modal-score-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--player-color);
    }

    .modal-score-name { flex: 1; text-align: left; font-weight: 600; }
    .modal-score-pts { font-size: 1.1rem; font-weight: 700; }

    .modal-trophy { font-size: 2.5rem; margin-bottom: 8px; }

    .modal-buttons { display: flex; gap: 12px; justify-content: center; }

    .modal-btn {
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .modal-btn:active { transform: scale(0.97); }

    .modal-btn.primary {
      background: #4a90e2;
      color: white;
      border: none;
    }

    .modal-btn.primary:hover { background: #357abd; }

    .modal-btn.secondary {
      background: white;
      color: #555;
      border: 2px solid #ddd;
    }

    .modal-btn.secondary:hover { border-color: #4a90e2; color: #4a90e2; }

    .error-msg {
      color: #e74c3c;
      font-size: 0.82rem;
      margin-top: 6px;
      min-height: 18px;
    }
  </style>
</head>
<body>

<!-- ── Setup ── -->
<div id="setup">
  <h1>Jogo do Pontinho</h1>
  <p class="subtitle">Conecte pontos, feche quadrados, marque seu nome!</p>

  <p class="section-title">Tamanho do tabuleiro</p>
  <div class="grid-config">
    <label>
      Colunas de pontos
      <input type="number" id="cols" value="6" min="3" max="15">
    </label>
    <label>
      Linhas de pontos
      <input type="number" id="rows" value="6" min="3" max="15">
    </label>
  </div>

  <div class="players-section">
    <p class="section-title">Jogadores</p>
    <div id="player-list"></div>
    <button id="btn-add-player">+ Adicionar jogador</button>
  </div>

  <div class="error-msg" id="setup-error"></div>
  <button id="btn-start">Iniciar Partida</button>
</div>

<!-- ── Game ── -->
<div id="game">
  <div id="game-header">
    <h1>Jogo do Pontinho</h1>
    <div id="scoreboard"></div>
  </div>
  <div id="turn-info"></div>
  <div id="board-container">
    <canvas id="canvas"></canvas>
  </div>
  <button id="btn-restart">Nova partida</button>
</div>

<!-- ── End Modal ── -->
<div id="modal-overlay">
  <div id="modal">
    <div class="modal-trophy">🏆</div>
    <h2 id="modal-title">Fim de jogo!</h2>
    <p class="result" id="modal-result"></p>
    <div id="modal-scores"></div>
    <div class="modal-buttons">
      <button class="modal-btn secondary" id="modal-new-config">Novo jogo</button>
      <button class="modal-btn primary" id="modal-rematch">Revanche</button>
    </div>
  </div>
</div>

<script>
// ── Palette ──
const COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63'];

// ── Setup State ──
let players = [];

function addPlayer(name = '') {
  if (players.length >= COLORS.length) return;
  const idx = players.length;
  const defaultNames = ['Jogador 1','Jogador 2','Jogador 3','Jogador 4','Jogador 5','Jogador 6'];
  players.push({ name: name || defaultNames[idx] || `Jogador ${idx+1}`, color: COLORS[idx] });
  renderPlayerList();
}

function removePlayer(idx) {
  if (players.length <= 2) return;
  players.splice(idx, 1);
  players.forEach((p, i) => p.color = COLORS[i]);
  renderPlayerList();
}

function renderPlayerList() {
  const list = document.getElementById('player-list');
  list.innerHTML = '';
  players.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'player-row';
    row.innerHTML = `
      <div class="player-color" style="background:${p.color}"></div>
      <input type="text" value="${p.name}" placeholder="Nome do jogador" data-idx="${i}">
      ${players.length > 2 ? `<button class="btn-remove" data-idx="${i}" title="Remover">✕</button>` : '<div style="width:30px"></div>'}
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('input[type="text"]').forEach(inp => {
    inp.addEventListener('input', e => {
      players[+e.target.dataset.idx].name = e.target.value;
    });
  });

  list.querySelectorAll('.btn-remove').forEach(btn => {
    btn.addEventListener('click', e => removePlayer(+e.target.dataset.idx));
  });
}

document.getElementById('btn-add-player').addEventListener('click', () => addPlayer());

// Init default 2 players
addPlayer(); addPlayer();

// ── Game State ──
let G = {}; // game object

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function startGame(rows, cols, playerDefs) {
  const CELL = Math.min(72, Math.floor((Math.min(window.innerWidth, 900) - 80) / cols));
  const DOT = 7;
  const LINE = 4;
  const PAD = 24;

  G = {
    rows, cols,
    cellSize: CELL,
    dotR: DOT,
    lineW: LINE,
    pad: PAD,
    // rows+1 x cols horizontal lines
    hLines: Array.from({length: rows+1}, () => new Array(cols).fill(0)),
    // rows x cols+1 vertical lines
    vLines: Array.from({length: rows}, () => new Array(cols+1).fill(0)),
    // rows x cols boxes (0 = empty, playerIndex+1)
    boxes: Array.from({length: rows}, () => new Array(cols).fill(0)),
    players: playerDefs.map((p, i) => ({ ...p, score: 0, idx: i })),
    currentPlayer: 0,
    totalBoxes: rows * cols,
    filledBoxes: 0,
    over: false,
  };

  buildScoreboard();
  updateTurnInfo();
  initCanvas();
  draw();
}

// ── Scoreboard ──
function buildScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  G.players.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'score-card' + (i === G.currentPlayer ? ' active' : '');
    card.id = `score-card-${i}`;
    card.style.setProperty('--player-color', p.color);
    card.innerHTML = `<div class="score-dot"></div><span class="score-name">${p.name}</span><span class="score-pts" id="score-pts-${i}">0</span>`;
    sb.appendChild(card);
  });
}

function updateScoreboard() {
  G.players.forEach((p, i) => {
    document.getElementById(`score-pts-${i}`).textContent = p.score;
    const card = document.getElementById(`score-card-${i}`);
    card.classList.toggle('active', i === G.currentPlayer);
  });
}

function updateTurnInfo() {
  const p = G.players[G.currentPlayer];
  const el = document.getElementById('turn-info');
  el.innerHTML = `Vez de <span style="color:${p.color}">${p.name}</span>`;
}

// ── Canvas ──
let canvas, ctx;

function initCanvas() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  const { rows, cols, cellSize, pad } = G;
  canvas.width  = cols * cellSize + pad * 2;
  canvas.height = rows * cellSize + pad * 2;
  canvas.style.cursor = 'default';

  canvas.onmousemove = onMouseMove;
  canvas.onclick     = onClick;
}

// ── Drawing ──
function dotX(c) { return G.pad + c * G.cellSize; }
function dotY(r) { return G.pad + r * G.cellSize; }

let hover = null; // { type:'h'|'v', r, c }

function draw() {
  const { rows, cols } = G;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Filled boxes
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const owner = G.boxes[r][c];
      if (owner > 0) {
        const p = G.players[owner - 1];
        ctx.fillStyle = hexAlpha(p.color, 0.22);
        ctx.fillRect(dotX(c)+1, dotY(r)+1, G.cellSize-2, G.cellSize-2);
        // Initial
        ctx.fillStyle = p.color;
        ctx.font = `bold ${Math.floor(G.cellSize * 0.42)}px Segoe UI, Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const initial = p.name.trim().charAt(0).toUpperCase();
        ctx.fillText(initial, dotX(c) + G.cellSize/2, dotY(r) + G.cellSize/2);
      }
    }
  }

  // Lines - horizontal
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      const owner = G.hLines[r][c];
      const isHover = hover && hover.type === 'h' && hover.r === r && hover.c === c;
      drawLine('h', r, c, owner, isHover);
    }
  }

  // Lines - vertical
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const owner = G.vLines[r][c];
      const isHover = hover && hover.type === 'v' && hover.r === r && hover.c === c;
      drawLine('v', r, c, owner, isHover);
    }
  }

  // Dots
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      ctx.arc(dotX(c), dotY(r), G.dotR, 0, Math.PI*2);
      ctx.fillStyle = '#222';
      ctx.fill();
    }
  }
}

function drawLine(type, r, c, owner, isHover) {
  const x1 = type === 'h' ? dotX(c)   : dotX(c);
  const y1 = type === 'h' ? dotY(r)   : dotY(r);
  const x2 = type === 'h' ? dotX(c+1) : dotX(c);
  const y2 = type === 'h' ? dotY(r)   : dotY(r+1);

  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineCap = 'round';

  if (owner > 0) {
    ctx.strokeStyle = G.players[owner-1].color;
    ctx.lineWidth = G.lineW;
    ctx.globalAlpha = 1;
  } else if (isHover && !G.over) {
    ctx.strokeStyle = G.players[G.currentPlayer].color;
    ctx.lineWidth = G.lineW;
    ctx.globalAlpha = 0.45;
  } else {
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 2;
    ctx.globalAlpha = 1;
  }

  ctx.stroke();
  ctx.globalAlpha = 1;
}

function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── Hit Detection ──
const HIT_RADIUS = 14;

function getLineAt(mx, my) {
  const { rows, cols } = G;

  // Horizontal lines
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x1 = dotX(c), x2 = dotX(c+1), y = dotY(r);
      if (mx >= x1 && mx <= x2 && Math.abs(my - y) < HIT_RADIUS) {
        return { type: 'h', r, c };
      }
    }
  }

  // Vertical lines
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c <= cols; c++) {
      const x = dotX(c), y1 = dotY(r), y2 = dotY(r+1);
      if (my >= y1 && my <= y2 && Math.abs(mx - x) < HIT_RADIUS) {
        return { type: 'v', r, c };
      }
    }
  }

  return null;
}

function onMouseMove(e) {
  if (G.over) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const line = getLineAt(mx, my);
  let newHover = null;
  if (line) {
    const arr = line.type === 'h' ? G.hLines : G.vLines;
    if (arr[line.r][line.c] === 0) {
      newHover = line;
      canvas.style.cursor = 'pointer';
    } else {
      canvas.style.cursor = 'default';
    }
  } else {
    canvas.style.cursor = 'default';
  }

  const changed = JSON.stringify(newHover) !== JSON.stringify(hover);
  hover = newHover;
  if (changed) draw();
}

function onClick(e) {
  if (G.over) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const line = getLineAt(mx, my);
  if (!line) return;

  const arr = line.type === 'h' ? G.hLines : G.vLines;
  if (arr[line.r][line.c] !== 0) return;

  playLine(line);
}

// ── Game Logic ──
function playLine(line) {
  const cp = G.currentPlayer;
  if (line.type === 'h') G.hLines[line.r][line.c] = cp + 1;
  else                   G.vLines[line.r][line.c] = cp + 1;

  const scored = checkBoxes(cp);
  G.filledBoxes += scored;

  if (G.filledBoxes >= G.totalBoxes) {
    G.over = true;
    draw();
    setTimeout(showEndModal, 400);
    return;
  }

  if (scored === 0) {
    G.currentPlayer = (G.currentPlayer + 1) % G.players.length;
  }

  updateScoreboard();
  updateTurnInfo();
  draw();
}

function checkBoxes(playerIdx) {
  let count = 0;
  const { rows, cols } = G;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (G.boxes[r][c] !== 0) continue;
      if (G.hLines[r][c] && G.hLines[r+1][c] && G.vLines[r][c] && G.vLines[r][c+1]) {
        G.boxes[r][c] = playerIdx + 1;
        G.players[playerIdx].score++;
        count++;
      }
    }
  }
  return count;
}

// ── End Modal ──
function showEndModal() {
  const sorted = [...G.players].sort((a, b) => b.score - a.score);
  const topScore = sorted[0].score;
  const winners = sorted.filter(p => p.score === topScore);

  const title = document.getElementById('modal-title');
  const result = document.getElementById('modal-result');
  title.textContent = 'Fim de jogo!';

  if (winners.length === 1) {
    result.innerHTML = `<strong>${winners[0].name}</strong> venceu com <strong>${topScore}</strong> casa${topScore !== 1 ? 's' : ''}!`;
  } else {
    result.innerHTML = `Empate! ${winners.map(p => `<strong>${p.name}</strong>`).join(' e ')} com <strong>${topScore}</strong> casas!`;
  }

  const scoresDiv = document.getElementById('modal-scores');
  scoresDiv.innerHTML = '';
  sorted.forEach(p => {
    const row = document.createElement('div');
    row.className = 'modal-score-row' + (p.score === topScore ? ' winner' : '');
    row.style.setProperty('--player-color', p.color);
    row.innerHTML = `
      <div class="modal-score-dot"></div>
      <span class="modal-score-name">${p.name}</span>
      <span class="modal-score-pts">${p.score}</span>
    `;
    scoresDiv.appendChild(row);
  });

  document.getElementById('modal-overlay').classList.add('show');
}

document.getElementById('modal-new-config').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  showSetup();
});

document.getElementById('modal-rematch').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  startGame(G.rows, G.cols, G.players.map(p => ({ name: p.name, color: p.color })));
});

// ── Navigation ──
function showSetup() {
  document.getElementById('setup').style.display = 'block';
  document.getElementById('game').style.display = 'none';
  document.body.style.alignItems = 'center';
}

function showGame() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.body.style.alignItems = 'flex-start';
}

document.getElementById('btn-start').addEventListener('click', () => {
  const err = document.getElementById('setup-error');
  const rows = clamp(parseInt(document.getElementById('rows').value) || 5, 3, 15);
  const cols = clamp(parseInt(document.getElementById('cols').value) || 5, 3, 15);

  // Validate names
  const names = players.map(p => p.name.trim());
  if (names.some(n => !n)) {
    err.textContent = 'Todos os jogadores precisam ter um nome.';
    return;
  }
  if (new Set(names).size !== names.length) {
    err.textContent = 'Os jogadores precisam ter nomes diferentes.';
    return;
  }
  err.textContent = '';

  showGame();
  startGame(rows, cols, players.map(p => ({ name: p.name.trim(), color: p.color })));
});

document.getElementById('btn-restart').addEventListener('click', showSetup);

// Update canvas on resize
window.addEventListener('resize', () => {
  if (!G.rows) return;
  // recalculate cell size
  const CELL = Math.min(72, Math.floor((Math.min(window.innerWidth, 900) - 80) / G.cols));
  G.cellSize = CELL;
  initCanvas();
  draw();
});
</script>
</body>
</html>
